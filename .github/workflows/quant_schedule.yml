name: US Quant 6-Modules 24H Auto Runner

on:
  schedule:
    # 월요일~금요일 24시간 내내 매시간 정각(0분)마다 자동 실행 (데이장 + 프리장 + 본장 + 애프터장 풀커버)
    # 만약 30분마다 더 촘촘하게 돌리고 싶다면 '0 * * * 1-5'를 '*/30 * * * 1-5'로 바꾸시면 됩니다!
    - cron: '0 * * * 1-5'
  workflow_dispatch: # 언제든 버튼 눌러 수동 즉시 실행 가능

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run 6-Modules Quant Engine (24H Full Session)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: node engine/run_6modules_quant.mjs
